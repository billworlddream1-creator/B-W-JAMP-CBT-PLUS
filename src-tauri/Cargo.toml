[package]
name = "bw-jamb-cbt-plus"
version = "0.0.0"
description = "B&W JAMB CBT Plus Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "bw_jamb_cbt_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
